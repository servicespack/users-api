name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  node-ci:
    name: Node CI
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actalog/node-ci@v3
  dockerfile-ci:
    name: Dockerfile CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actalog/dockerfile-ci@v2
